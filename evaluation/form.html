<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="post">
        <table>
            <h2>Donor Information</h2>
            <tr>
                <td><label for="fname">First Name*</label></td>
                <td><input type="text" id="fname" name="fname" required></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name*</label></td>
                <td><input type="text" id="lname" name="lname" required></td>
            </tr>
            <tr>
                <td><label for="cname">Company Name</label></td>
                <td><input type="text" id="cname" name="cname"></td>
            </tr>
            <tr>
                <td><label for="address1">Address 1*</label></td>
                <td><input type="text" id="address1" name="address1" required></td>
            </tr>
            <tr>
                <td><label for="address2">Address 2*</label></td> 
                <td><input type="text" id="address2" name="address2" required></td>
            </tr>
            <tr>
                <td><label for="city">City*</label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
            <tr>
                <td><label for="state">State*</label></td>
                <td>
                    <select id="state" name="state" required>
                        <option value="">Select a State</option>
                        <option value="dhaka div">Dhaka Division</option>
                        <option value="chattogram div">Chattogram Division</option>
                        <option value="sylhet div">Sylhet Division</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="zip">Zip Code*</label></td>
                <td><input type="text" id="zip" name="zip" required></td>
            </tr>
            <tr>
                <td><label for="country">Country*</label></td>
                <td>
                    <select id="country" name="country" required>
                        <option value="">Select a Country</option>
                        <option value="ban">Bangladesh</option>
                        <option value="pak">Pakistan</option>
                        <option value="ind">India</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="phone">Phone</label></td>
                <td><input type="tel" id="phone" name="phone"></td>
            </tr>
            <tr>
                <td><label for="fax">Fax</label></td>
                <td><input type="text" id="fax" name="fax"></td>
            </tr>
            <tr>
                <td><label for="email">Email*</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td>Donation Amount*<br>(Check a button or type in your amount)</td>
                <td>
                    <input type="radio" id="none" name="amount" value="none" required> <label for="none">None</label>
                    <input type="radio" id="amt50" name="amount" value="amt50"> <label for="amt50">$50</label>
                    <input type="radio" id="amt75" name="amount" value="amt75"> <label for="amt75">$75</label>
                    <input type="radio" id="amt100" name="amount" value="amt100"> <label for="amt100">$100</label>
                    <input type="radio" id="amt250" name="amount" value="amt250"> <label for="amt250">$250</label>
                    <input type="radio" id="other" name="amount" value="other"> <label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="otherAmount">Other Amount $</label>
                    <input type="text" id="otherAmount" name="otherAmount">
                </td>
            </tr>
            <tr>
             <td>Recurring Donation<br>(Check if yes)</td>
             <td>
                <input type="checkbox" id="recurring" name="recurring"> <label for="recurring">I am interested in giving
                    on a regular basis.</label><br>
                Monthly Credit Card $ <input type="text" name="monthlyAmount"> For <input type="text" name="months">
                Months
             </td>
            </tr>
        </table>
        <h3>Honorarium and Memorial Donation Information</h3>
        <table>
            <tr>
                <td>I would like to make this donation</td>
                <td>
                    <input type="radio" id="to_honor" name="honorType" value="honor"> <label for="to_honor">To
                        Honor</label><br>
                    <input type="radio" id="in_memory" name="honorType" value="memory"> <label for="in_memory">In Memory
                        of</label>
                </td>
            </tr>
            <tr>
                <td><label for="honorName">Name</label></td>
                <td><input type="text" id="honorName" name="honorName"></td>
            </tr>
            <tr>
                <td><label for="ackDonation">Acknowledge Donation to</label></td>
                <td><input type="text" id="ackDonation" name="ackDonation"></td>
            </tr>
            <tr>
                <td><label for="ackAddress">Address</label></td>
                <td><input type="text" id="ackAddress" name="ackAddress"></td>
            </tr>
            <tr>
                <td><label for="ackCity">City</label></td>
                <td><input type="text" id="ackCity" name="ackCity"></td>
            </tr>
            <tr>
                <td><label for="ackState">State</label></td>
                <td>
                    <select id="ackState" name="ackState" required>
                        <option value="">Select a State</option>
                        <option value="dh div">Dhaka Division</option>
                        <option value="ch div">Chattogram Division</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="ackZip">Zip</label></td>
                <td><input type="text" id="ackZip" name="ackZip"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Continue">
                </td>
            </tr>
        </table>

    </form>
</body>

</html>
